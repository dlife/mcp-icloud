[project]
name = "icloud-mcp"
version = "0.1.0"
description = "MCP-server voor iCloud (mail, agenda, herinneringen, drive, foto's)"
requires-python = ">=3.11"
dependencies = ["mcp>=1.12,<2", "uvicorn>=0.30", "caldav>=2.0", "icalendar>=6.0",
    "pymupdf>=1.24", "python-docx>=1.1", "openpyxl>=3.1", "python-pptx>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[project.scripts]
icloud-mcp = "icloud_mcp.server:main"
icloud-mcp-setup = "icloud_mcp.setup:main"
